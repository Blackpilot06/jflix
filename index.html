<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JFLIX</title>
<style>
:root{--bg:#0a0b10;--sf:#14161f;--sf2:#1c1f2b;--tx:#f1f2f6;--mu:#8d91a3;--ac:#ffb400;--ac2:#ff4d6d;--bd:#262a38;--w:150px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:1500px){:root{--w:172px}}@media(max-width:900px){:root{--w:135px}}@media(max-width:520px){:root{--w:104px}}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,11,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:18px;padding:0 18px;height:52px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:1.5px;font-size:18px;cursor:pointer;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#14100a;font-style:normal;font-size:16px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}nav::-webkit-scrollbar{display:none}
nav a{padding:6px 12px;border-radius:8px;color:var(--mu);cursor:pointer;white-space:nowrap}nav a:hover{color:var(--tx)}nav a.on{color:var(--tx);background:var(--sf2)}
.ic{background:none;border:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.ic:hover{background:var(--sf2)}
#hero{position:relative;height:clamp(300px,42vw,440px);overflow:hidden;margin:12px 18px 0;border-radius:14px}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .6s;pointer-events:none;background:radial-gradient(circle at 78% 35%,rgba(255,255,255,.2),transparent 30%),linear-gradient(115deg,hsl(var(--h) 55% 10%),hsl(calc(var(--h) + 40) 65% 28%))}
.sl.on{opacity:1;pointer-events:auto}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,16,.85) 0,rgba(10,11,16,.25) 60%,transparent),linear-gradient(0deg,rgba(10,11,16,.7),transparent 50%)}
.hc{position:absolute;z-index:2;left:clamp(16px,4vw,44px);bottom:clamp(30px,5vw,48px);max-width:min(520px,86%)}
.tg{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:var(--ac);color:#14100a;font-weight:700;padding:2px 8px;border-radius:5px}
.hc h1{font-size:clamp(24px,4vw,38px);margin:8px 0 4px;line-height:1.1}.hm{color:#d5d7e0;font-size:13px}.hc p{margin:8px 0 12px;color:#cfd2dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hb{display:flex;gap:8px;flex-wrap:wrap}.hb button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);border-radius:8px;padding:8px 14px;font-weight:600}.hb .bp{background:var(--ac);color:#14100a;border-color:var(--ac)}
.hn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.45);font-size:20px}.hn.p{left:8px}.hn.n{right:8px}
.dots{position:absolute;z-index:3;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.dots button{width:18px;height:4px;border:0;border-radius:3px;background:rgba(255,255,255,.35);padding:0}.dots button.on{background:var(--ac);width:30px}
#trl{position:absolute;z-index:4;right:14px;bottom:30px;width:min(300px,60%);aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#000,#1a1d2a);border:1px solid var(--bd);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:12px}
#trl .bar{height:3px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}#trl .bar i{display:block;height:100%;background:var(--ac);animation:pg 6s linear infinite}
#trl .x{position:absolute;top:4px;right:4px;background:none;border:0;font-size:18px}
@keyframes pg{from{width:0}to{width:100%}}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:6px 14px;color:var(--mu)}.tb:hover{color:var(--tx)}.tb.on{background:var(--tx);color:#111;border-color:var(--tx)}
main{padding:6px 18px 10px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}.sh h2{margin:0;font-size:17px}.sh a{color:var(--ac);cursor:pointer;font-size:13px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.ctl label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:3px}.ctl select{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:120px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--bd);background:var(--sf);border-radius:18px;padding:5px 13px}.chip.on{background:var(--ac);color:#14100a;border-color:var(--ac);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w),1fr));gap:14px 10px}
.cd{cursor:pointer;position:relative}
.ps{position:relative;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:radial-gradient(circle at 70% 26%,rgba(255,255,255,.22),transparent 38%),linear-gradient(160deg,hsl(var(--h) 65% 38%),hsl(calc(var(--h) + 50) 60% 13%));transition:transform .18s,box-shadow .18s}
.tt{position:absolute;left:8px;right:8px;bottom:8px;font-weight:800;font-size:clamp(12px,1.2vw,15px);line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rt,.qq{position:absolute;top:6px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.65)}.rt{left:6px}.rt.s{background:var(--ac2)}.qq{right:6px;background:var(--ac);color:#14100a}
.ov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:9px;background:linear-gradient(0deg,rgba(8,9,14,.97) 30%,rgba(8,9,14,.55));opacity:0;transition:opacity .18s;font-size:11px}
.ov p{margin:0;color:#cfd2dc;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.mm{color:var(--ac);font-weight:600}
.bt{display:flex;gap:5px}.bt button{flex:1;border:0;border-radius:6px;padding:5px 2px;font-size:11px;font-weight:600;background:var(--sf2)}.bt button+button{background:var(--ac);color:#14100a}
.pvw{display:none;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}.pvw i{display:block;height:100%;background:var(--ac);animation:pg 3s linear infinite}.cd.pl .pvw{display:block}
@media(hover:hover){.cd:hover{z-index:5}.cd:hover .ps{transform:translateY(-4px) scale(1.04);box-shadow:0 10px 26px rgba(0,0,0,.6)}.cd:hover .ov{opacity:1}}
.cd.on .ov{opacity:1}
.nm{margin-top:6px}.nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm span{font-size:11px;color:var(--mu)}
.rw{position:relative}.rr{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:10px 4px 12px;scrollbar-width:none}.rr::-webkit-scrollbar{display:none}.rr .cd{flex:0 0 var(--w);scroll-snap-align:start}
.ra{position:absolute;top:calc(50% - 34px);z-index:6;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:rgba(10,11,16,.92);font-size:18px;display:none}.ra.l{left:-10px}.ra.r{right:-10px}
@media(hover:hover){.rw:hover .ra{display:grid;place-items:center}}
.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);z-index:1}.pg i{display:block;height:100%;background:var(--ac)}
.ct{position:absolute;z-index:3;right:14px;top:12px;font-weight:700;font-size:12px;letter-spacing:1px;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:12px}
#bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,11,16,.97);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}#bn a{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}#bn a b{display:block;font-size:17px;font-weight:400}#bn a.on{color:var(--ac)}
@media(max-width:600px){#bn{display:flex}body{padding-bottom:58px}}
.nt{flex:0 0 150px;height:74px;border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,hsl(var(--h) 60% 30%),hsl(calc(var(--h) + 40) 55% 14%));border:1px solid var(--bd);transition:transform .15s}.nt:hover{transform:translateY(-3px)}.nt b{font-size:14px}.nt span{font-size:11px;color:#ffd98a}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}.ng .nt{flex:none}
.nb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px;border-radius:14px;margin:8px 0 12px;background:linear-gradient(115deg,hsl(var(--h) 55% 14%),hsl(calc(var(--h) + 40) 60% 28%))}.nb h2{margin:6px 0 2px;font-size:22px}
.cl{display:flex;gap:14px;margin-bottom:18px}.cdate{flex:0 0 54px;text-align:center;background:var(--sf);border-radius:10px;padding:8px 0;height:max-content}.cdate b{display:block;font-size:20px}.cdate span{font-size:11px;color:var(--mu);text-transform:uppercase}.cl .gr{flex:1;grid-template-columns:repeat(auto-fill,minmax(var(--w),var(--w)))}
footer{margin:22px 18px;padding:14px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);font-size:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}footer b{color:var(--tx)}
#sr{position:fixed;inset:0;z-index:50;background:rgba(10,11,16,.97);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 24px}
.sb{display:flex;gap:10px;align-items:center;max-width:720px;margin:0 auto 16px}.sb input{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:11px 18px;font-size:16px;outline:0}.sb input:focus{border-color:var(--ac)}
.hint{text-align:center;color:var(--mu);margin:30px 0}
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:14px}
.bx{background:var(--sf);border:1px solid var(--bd);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:190px 1fr}
.bx .ps{border-radius:14px 0 0 14px;aspect-ratio:auto;min-height:290px;height:100%}.inf{padding:18px}.inf h3{margin:0 0 4px;font-size:21px}.inf p{color:#bfc2cf}
.x{float:right;background:none;border:0;font-size:24px;color:var(--mu)}
.src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;font-size:12px}.src .n{flex:1;font-weight:600}.q{padding:2px 7px;border-radius:5px;background:var(--sf2);font-size:11px}.bad{color:var(--ac2)}
.pb{border:0;border-radius:7px;background:var(--ac);color:#14100a;font-weight:700;padding:6px 12px}
.scr{display:none;aspect-ratio:16/9;border-radius:10px;background:#000;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:#ccc}
.eps div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}
@media(max-width:600px){header{gap:8px;padding:0 10px}.logo span{display:none}main,#tabs{padding-left:10px;padding-right:10px}#hero{margin:10px 10px 0}.bx{grid-template-columns:1fr}.bx .ps{border-radius:14px 14px 0 0;min-height:170px;height:170px}.cl{flex-direction:column;gap:6px}.cdate{flex-direction:row;display:flex;gap:6px;justify-content:center;width:max-content;padding:4px 12px}.cdate b{font-size:14px}footer{margin:18px 10px}}
.ps img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ps img~.tt{display:none}.rt,.qq{z-index:1}
#trl{overflow:hidden}#trl .x{z-index:3}
a.pb{text-decoration:none;display:inline-block;color:#14100a}
.cast{display:flex;gap:10px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}.cs{flex:0 0 76px;text-align:center}.cs img,.cs i{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sf2);display:block;margin:0 auto 4px}.cs b{display:block;font-size:11px;font-weight:600}.cs span{color:var(--mu);font-size:10px;display:block;max-height:28px;overflow:hidden}
</style>
</head>
<body>
<header>
<div class="logo" data-v="home"><i>J</i><span>FLIX</span></div>
<nav id="nav"></nav>
<button class="ic" id="so" aria-label="Search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</header>
<div id="hero"><div id="sls"></div><button class="hn p" data-h="p">‹</button><button class="hn n" data-h="n">›</button><div class="ct" id="ct"></div><div class="dots" id="dots"></div>
<div id="trl" hidden><button class="x" data-h="x">×</button><div id="trf"></div><b id="trt"></b><span>Trailer preview · muted autoplay</span><div class="bar"><i></i></div></div></div>
<div id="tabs"></div>
<main id="root"></main>
<footer id="ft"></footer>
<div id="sr" hidden><div class="sb"><input id="si" placeholder="Search movies, series, anime or alternative titles…" autocomplete="off"><button class="ic" id="sx" aria-label="Close">✕</button></div><div id="sg"></div></div>
<div id="bn"></div>
<div id="md" hidden><div class="bx" id="bx"></div></div>
<script src="config.js"></script>
<script src="data/catalogue.js"></script>
<script>
var TODAY=new Date().toISOString().slice(0,10),$=function(i){return document.getElementById(i)},S={v:"home",g:"All",y:"All",l:"All",o:"def"};
var CFG=window.JFLIX_CONFIG||{},IMG="https://image.tmdb.org/t/p/",LIVE={};
var D=window.JFLIX_DATA||{items:[],networks:[]},TL={m:"Movie",t:"Series",a:"Anime"},SV=D.networks.map(function(n){return n.name}),NH={},EMB={};
D.networks.forEach(function(n){NH[n.name]=n.hue;EMB[n.name]=!!n.embed});
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function im(it){return it.poster?'<img src="'+it.poster+'" alt="" loading="lazy" onerror="this.remove()">':''}
function mk(x){var o=Object.assign({},x),n=parseInt(String(o.id).replace(/\D/g,""),10)||1;o.up=o.d>TODAY;o.h=o.h||(n*47)%360;o.q=o.up?"":(o.q||"");o.tr=(o.tags||[]).indexOf("trending")>-1;o.eps=o.k!=="m"&&(o.ep||[]).length>0;o.nets=o.nets||[];o.sv=o.nets[0]||null;o.src=o.src||["TMDB"];o.alt=o.alt||"";o.pp=o.pp||0;o.add=o.add||o.d;return o}
var ALL=D.items.map(mk),DUP=D.dup||0;
/* live TMDB access goes through the proxy (config.js). The browser never holds a TMDB credential. */
function api(p,q){if(!CFG.PROXY_URL)return Promise.reject(new Error("no proxy"));return fetch(CFG.PROXY_URL.replace(/\/$/,"")+p+(q?"?"+q:"")).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function liveItem(x,kind){var id=kind[0]+x.id,f=find(id);if(f)return f;var gm=D.genres||{};
var o=mk({id:id,k:kind[0],t:esc(x.title||x.name||""),d:x.release_date||x.first_air_date||"",r:Math.round((x.vote_average||0)*10)/10,g:[].concat.apply([],(x.genre_ids||[]).map(function(i){return gm[i]||[]})),l:esc((x.original_language||"").toUpperCase()),o:esc((x.overview||"Synopsis not available yet.").slice(0,420)),poster:/^\/[\w.-]+$/.test(x.poster_path||"")?IMG+"w342"+x.poster_path:"",backdrop:"",pp:Math.round(x.popularity||0),tags:[],nets:[],src:["TMDB"],watch:{link:"https://www.themoviedb.org/"+kind+"/"+x.id+"/watch",flatrate:[],free:[]}});LIVE[id]=o;return o}
function castHTML(c){return c&&c.length?'<b>Cast</b><div class="cast">'+c.map(function(p){return'<div class="cs">'+(p.p?'<img src="'+IMG+'w185'+p.p+'" loading="lazy" alt="" onerror="this.remove()">':'<i></i>')+'<b>'+p.n+'</b><span>'+p.c+'</span></div>'}).join("")+'</div>':''}
function recHTML(a){a=a.filter(Boolean).slice(0,12);return a.length?'<div class="sh" style="margin:14px 0 6px"><h2 style="font-size:15px">More like this</h2></div><div class="rw"><div class="rr">'+a.map(card).join("")+'</div></div>':''}
function ext(it){var inf=$("bx").querySelector(".inf"),id=String(it.id);$("bx").dataset.cur=id;inf.insertAdjacentHTML("beforeend",'<div id="dx"></div>');
$("dx").innerHTML=castHTML(it.cast)+recHTML((it.rec||[]).map(find));
if(!CFG.PROXY_URL)return;var kind=id[0]==="t"?"tv":"movie";
api("/"+kind+"/"+id.slice(1),"append_to_response=credits,recommendations").then(function(r){if($("bx").dataset.cur!==id||!$("dx"))return;
var cast=((r.credits||{}).cast||[]).slice(0,10).map(function(c){return{n:esc(c.name),c:esc(c.character||""),p:/^\/[\w.-]+$/.test(c.profile_path||"")?c.profile_path:""}}),
recs=((r.recommendations||{}).results||[]).filter(function(x){return x.poster_path&&(x.release_date||x.first_air_date)}).map(function(x){return liveItem(x,kind)}),
html=castHTML(cast)+recHTML(recs);if(html)$("dx").innerHTML=html}).catch(function(){})}
function find(i){return ALL.filter(function(x){return x.id==i})[0]||LIVE[i]}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function srt(a,m){a=a.slice();if(m==="pop")a.sort(function(x,y){return y.pp-x.pp});else if(m==="rate")a.sort(function(x,y){return y.r-x.r});else if(m==="new")a.sort(function(x,y){return y.d.localeCompare(x.d)});return a}
function flt(a){return a.filter(function(x){return(S.g==="All"||x.g.indexOf(S.g)>-1)&&(S.y==="All"||x.d.slice(0,4)===S.y)&&(S.l==="All"||x.l===S.l)})}
function base(v){var a=ALL.slice(),nw=function(a){return srt(a,"new")};
if(v==="movies")return nw(a.filter(function(x){return x.k==="m"}));if(v==="tv")return nw(a.filter(function(x){return x.k==="t"}));if(v==="anime")return nw(a.filter(function(x){return x.k==="a"}));
if(v==="toprated")return srt(a.filter(function(x){return(x.tags||[]).indexOf("toprated")>-1}),"rate");if(v==="latest")return nw(a.filter(function(x){return!x.up}));if(v==="trending")return srt(a.filter(function(x){return x.tr}),"pop");
if(v==="popular")return srt(a.filter(function(x){return!x.up}),"pop");if(v==="soon")return a.filter(function(x){return x.up}).sort(function(x,y){return x.d.localeCompare(y.d)});
